<style>
/* Layout: dashboard shell (header · tabs · main + device rail). Test Cases tab = intro, 3 question cards and one Run button; after Run, an automatic progress list, then results. Single dark theme on purpose — it mirrors the product. */
:root {
	color-scheme: dark;
	--bg: #0f1115;
	--panel: #1a1d24;
	--panel-2: #20242d;
	--border: #2a2e37;
	--text: #e6e8eb;
	--muted: #8a8f99;

	--info: #7aa7ff;
	--proto: #c9a7ff;

* { box-sizing: border-box; }

.muted { color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* Prototype controls — visually distinct from the product UI */
.proto-bar { border-bottom: 1px dashed var(--proto); background: color-mix(in srgb, var(--proto) 8%, var(--bg)); padding-block: 8px; padding-inline: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.82rem; }
.proto-bar strong { color: var(--proto); letter-spacing: 0.04em; text-transform: uppercase; font-size: 0.72rem; }

header.app { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 12px; padding-inline: 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }

.seg-toggle input { position: absolute; opacity: 0; pointer-events: none; }

.seg-toggle label:has(input:focus-visible) { outline: 2px solid var(--info); outline-offset: -2px; }

.radio-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.radio-card { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; display: flex; gap: 8px; cursor: pointer; }
.radio-card:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.radio-card input { margin-top: 3px; }

/* Branch combobox */
.combo { position: relative; }
.combo-list { position: absolute; z-index: 10; left: 0; right: 0; top: calc(100% + 4px); background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; max-height: 240px; overflow-y: auto; box-shadow: 0 10px 24px rgb(0 0 0 / 0.35); }
.combo-item { display: flex; justify-content: space-between; gap: 8px; padding: 7px 10px; cursor: pointer; }
.combo-item:hover, .combo-item.on { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.tag { font-size: 0.68rem; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }

/* Tables */
.table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 8px; max-height: 320px; }
table { border-collapse: collapse; width: 100%; font-size: 0.84rem; }
th, td { text-align: left; padding: 6px 9px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.04em; background: var(--panel-2); position: sticky; top: 0; }

tr.clickable { cursor: pointer; } tr.clickable:hover td { background: color-mix(in srgb, var(--accent) 7%, transparent); }

.badge { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 1px 7px; border-radius: 4px; letter-spacing: 0.03em; white-space: nowrap; }
.b-PASS { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
.b-FAIL { background: color-mix(in srgb, var(--danger) 20%, transparent); color: var(--danger); }
.b-BLOCKED { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
.b-EVIDENCE_ONLY, .b-UNDECIDED { background: color-mix(in srgb, var(--info) 18%, transparent); color: var(--info); }
.b-FLAKY { background: color-mix(in srgb, var(--proto) 20%, transparent); color: var(--proto); }
.b-QUEUED { background: var(--panel-2); color: var(--muted); }

.human { font-size: 0.78rem; }

/* Automatic progress list */
.summary-line { display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 0.88rem; }
.stages { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }

.stage .ic { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 0.8rem; font-weight: 700; border: 1px solid var(--border); color: var(--muted); }
.stage.ok .ic, .stage.skip .ic { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 15%, transparent); }
.stage.run .ic { color: var(--info); border-color: var(--accent); }
.stage.error .ic { color: var(--danger); border-color: var(--danger); background: color-mix(in srgb, var(--danger) 15%, transparent); }

.stage-title { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; padding-top: 2px; }

.stage-note { margin-left: auto; font-size: 0.82rem; color: var(--muted); }
.stage.ok .stage-note, .stage.skip .stage-note { color: var(--ok); }

.stage.needs .stage-note, .stage.waiting .stage-note { color: var(--warn); }
.stage-body { grid-column: 2; display: flex; flex-direction: column; gap: 8px; margin-top: 8px; min-width: 0; }
.sub { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 0.84rem; }
.sub li { display: flex; gap: 8px; align-items: baseline; }

.sub .ok { color: var(--ok); } .sub .wait { color: var(--muted); }
.spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid color-mix(in srgb, currentColor 22%, transparent); border-top-color: currentColor; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -2px; }

.case-strip { display: flex; gap: 4px; flex-wrap: wrap; }
.approval { border: 1px solid var(--warn); background: color-mix(in srgb, var(--warn) 8%, transparent); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }

.summary-nums { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.86rem; }

.rail { display: flex; flex-direction: column; gap: 12px; }

.map-step > div:last-child { min-width: 0; overflow-wrap: anywhere; }

function stageView(s) {

	if (S.runKind !== "cases" && S.phase === "results") return "";

			<h2 style="font-size:1rem">Save as macro</h2>
			<label class="field"><span>Name</span><input id="macroName" value="${esc(defaultName)}" /></label>
			<label class="field"><span>Kind</span><select id="macroKind">${Object.entries(KIND_LABEL).map(([k, v]) => `<option value="${k}" ${k === S.promptKind ? "selected" : ""}>${v}</option>`).join("")}</select></label>
			<div class="panel-title">Map of the macro — check it at a glance</div>
			${macroMap(S.recorded)}
			<div class="note">📁 Saved in the repository: <code>${macroPath(defaultName)}</code> — next to the UI tests, <b>never added to the app</b> or any build target. New element IDs go into <code>BlibliMobile_XCUITest/TestForgeMacros/elements.json</code>.</div>
			<label class="row"><input type="checkbox" id="macroReviewed" data-act="macro-reviewed" /> I've checked the map — these steps do what I asked</label>
			<div class="row"><button data-act="confirm-macro" id="confirmMacro" disabled>Save macro</button><button class="ghost" data-act="close-overlay">Cancel</button></div></div></div>`;
		return;
	}
	root.innerHTML = "";
}

// ---------------------------------------------------------------------------------------------
// The automatic pipeline (fake, timed to feel real)
// ---------------------------------------------------------------------------------------------
function startPipeline() {
	if (S.skipBuild && S.skipReason.trim().length < 8) { S.advOpen = true; render(); toast("Give a reason for not building (More options)"); return; }
	S.phase = "pipeline"; S.runResults = {}; S.human = {}; S.flaky = new Set(); S.runIndex = 0; S.approval = null; S.paused = false;
	S.recorded = []; S.promptResult = null; S.promptReview = null; S.savedMacro = false; S.showChange = false; S.replayIndex = 0; S.heal = null;
	const runLabel = S.runKind === "prompt" ? (S.promptKind === "routine" ? "Claude records the routine" : "Claude checks it") : S.runKind === "replay" ? `Replay “${S.replayMacro.name}” (no Claude)` : `Run ${S.selected.size} test(s)`;
	S.stages = [
		{ key: "code", label: isLocal() ? "Snapshot your local repository" : "Get the code", state: "wait" },
		{ key: "build", label: "Build the app", state: "wait" },
		{ key: "device", label: "Get the QA simulator ready", state: "wait" },
		{ key: "check", label: "Final checks", state: "wait" },
		{ key: "run", label: runLabel, state: "wait" },
	];
	render(); runStage(0);
}
function animate(s, items, total, done) {
	s.state = "run"; s.problem = null; s.note = ""; s.lines = items.map((label, i) => ({ label, s: i ? "wait" : "run" })); render();
	const per = total / items.length;
	items.forEach((_, i) => later(per * (i + 1), () => { s.lines[i].s = "ok"; if (s.lines[i + 1]) s.lines[i + 1].s = "run"; render(); if (i === items.length - 1) done(); }));
}
function finish(i, state, note) { const s = S.stages[i]; s.state = state; s.note = note; s.lines = []; s.problem = null; render(); later(350, () => runStage(i + 1)); }
function stop(i, state, problem, note) { const s = S.stages[i]; s.state = state; s.lines = []; s.problem = problem; s.note = note ?? ""; render(); }
function runStage(i) {
	const s = S.stages[i];
	if (!s || S.phase !== "pipeline") return;
	switch (s.key) {
		case "code": {
			const sha = targetSha();
			if (S.preparedSha === sha) { S.sha = sha; finish(i, "skip", `Already up to date · ${sha}`); return; }
			if (S.scenario === "vpn" && !S.vpnRetried) {
				animate(s, ["Contact GitHub"], 1200, () => { S.vpnRetried = true; stop(i, "error", `<div class="callout error"><span>⚠️</span><span class="grow"><b>Can't reach GitHub.</b> This usually means the VPN is off. Connect the VPN, then retry.</span><button data-act="retry" data-i="${i}">Retry</button></div>`, "Couldn't reach GitHub"); });
				return;
			}
			const items = isLocal() ? [`Read ${localInfo().path} (read only)`, "Copy the snapshot", "Install libraries (only if they changed)"] : ["Download the latest code", `Switch to ${S.branch}`, "Install libraries (only if they changed)"];
			animate(s, items, 1800, () => { S.preparedSha = sha; S.sha = sha; finish(i, "ok", `${codeBranch()} @ ${sha}`); });
			return;
		}
		case "build": {
			if (S.skipBuild) { finish(i, "skip", "Skipped — UNVERIFIED BUILD"); return; }
			if (S.builtSha === S.sha) { finish(i, "skip", `Already built for ${S.sha}`); return; }
			animate(s, ["Compile the app", "Compile the test runner", "Package"], 2100, () => {
				if (S.scenario === "buildfail" && !S.buildRetried) { S.buildRetried = true; stop(i, "error", `<div class="callout error"><span>✗</span><span class="grow"><b>The app didn't build.</b> First error: <code>FlashSaleHeaderView.swift:118: cannot find 'BliBadge' in scope</code>. That's a problem in the code on this branch, not in your setup — send the log to its developer.</span><button class="ghost" data-act="copy-log">Copy log</button><button data-act="retry" data-i="${i}">Try again</button></div>`, "Build failed"); return; }
				S.builtSha = S.sha; finish(i, "ok", "Built in 8 min 12 s");
			});
			return;
		}
		case "device": {
			if (S.simState === "booted" && S.harness === "up" && S.installedSha === S.sha) { finish(i, "skip", "Ready"); return; }
			const items = [S.simState === "missing" ? "Create the QA simulator (first time only)" : S.simState === "booted" ? "QA simulator is on" : "Start the QA simulator", "Install the new build", "Start the test runner"];
			animate(s, items, 1600, () => { S.simState = "booted"; S.harness = "up"; S.installedSha = S.sha; finish(i, "ok", "Ready"); });
			return;
		}
		case "check": {
			if (S.scenario === "busy" && !S.busyDone) {
				stop(i, "waiting", `<div class="callout warn"><span>⏳</span><span class="grow"><b>Waiting for the simulator</b> — “Run SF-040 (chat)” is using it. This continues by itself when it's free.</span><button class="ghost" data-act="noop">Open Queue</button></div>`, "Waiting…");
				later(2600, () => { S.busyDone = true; runStage(i); });
				return;
			}
			if (S.scenario === "disk" && !S.diskFixed) {
				animate(s, ["Code, build and simulator match", "Claude and the test tools are connected", "Disk space"], 900, () => stop(i, "needs", `<div class="callout warn"><span>💾</span><span class="grow"><b>Not enough disk space</b> — 6 GB free, 10 GB needed. Old QA copies not used for 14 days take 22 GB.</span><button data-act="free-disk" data-i="${i}">Free 22 GB and continue</button></div>`, "Needs you"));
				return;
			}
			animate(s, ["Code, build and simulator match", "Claude and the test tools are connected", "Disk space", "Nobody else is using the simulator"], 900, () => finish(i, "ok", "All good"));
			return;
		}
		case "run": s.state = "run"; s.note = ""; render(); (S.runKind === "prompt" ? runPrompt : S.runKind === "replay" ? runReplay : runNext)(); return;
	}
}
function runPrompt() {
	const s = stage("run");
	PROMPT_STEPS.forEach((step, i) => later(750 * (i + 1), () => {
		if (S.phase !== "pipeline") return;
		S.recorded.push(step); render();
		if (i === PROMPT_STEPS.length - 1) later(700, () => {
			s.state = "ok"; s.note = `${PROMPT_STEPS.length} steps recorded`; S.phase = "results";
			S.promptResult = { verdict: "PASS", summary: "The Tomorrow tab opened in 0.8 s, the product list appeared with 12 products and the app stayed responsive. “Remind me” is shown on each product." };
			render(); toast("Done — review the result, then save it as a macro if you like");
		});
	}));
}
function runReplay() {
	const s = stage("run"); const m = S.replayMacro;
	if (S.replayIndex >= m.steps.length) { s.state = "ok"; s.note = `${m.steps.length} steps in 9 s`; S.phase = "results"; m.last = "✓ just now"; render(); toast("Replay passed"); return; }
	later(450, () => {
		if (S.phase !== "pipeline") return;
		if (S.scenario === "heal" && !S.healed && S.replayIndex === 2) { S.heal = "found"; s.state = "needs"; s.note = "Needs you"; render(); return; }
		S.replayIndex += 1; render(); runReplay();
	});
}
function runNext() {
	const cases = runCases();
	const s = stage("run");
	if (S.runIndex >= cases.length) { s.state = "ok"; s.note = `${cases.length} done`; S.phase = "results"; render(); toast("Tests finished — please review the results"); return; }
	S.tick = 0;
	const id = cases[S.runIndex].id;
	const iv = setInterval(() => {
		if (S.phase !== "pipeline") { clearInterval(iv); return; }
		if (S.approval) return;
		S.tick += 1;
		if (S.policy === "ask" && id === "SF-013" && S.tick === 2 && !S.approvedOnce) { S.approval = true; render(); return; }
		if (S.tick >= 5) {
			clearInterval(iv);
			S.runResults[id] = RESULTS[id] ?? { verdict: "PASS", observed: "As expected.", shots: 1, secs: 60 };
			S.runIndex += 1;
			if (S.paused) { s.state = "ok"; s.note = "Paused"; S.phase = "results"; S.paused = false; render(); toast(`Paused after ${id}`); return; }
			render(); later(250, runNext); return;
		}
		render();
	}, 420);
	S.runIv = iv;
}

// Scenarios ------------------------------------------------------------------------------------
const ready = () => Object.assign(S, { casesRead: true, preparedSha: "a1b2c3d", builtSha: "a1b2c3d", installedSha: "a1b2c3d", simState: "booted", harness: "up" });
const doneStages = () => [["code", "Get the code", "Already up to date · a1b2c3d"], ["build", "Build the app", "Already built for a1b2c3d"], ["device", "Get the QA simulator ready", "Ready"], ["check", "Final checks", "All good"], ["run", "Run 8 test(s)", "8 done"]].map(([key, label, note]) => ({ key, label, note, state: "ok" }));
const SCENARIOS = {
	home: { label: "Home", apply: () => { TAB = "home"; ready(); S.casesRead = false; } },
	fresh: { label: "First time", apply: () => {} },
	repeat: { label: "Second time (fast)", apply: () => { ready(); } },
	vpn: { label: "VPN off", apply: () => { S.casesRead = true; S.scenario = "vpn"; startPipeline(); } },
	buildfail: { label: "Build fails", apply: () => { Object.assign(S, { casesRead: true, preparedSha: "a1b2c3d", scenario: "buildfail" }); startPipeline(); } },
	disk: { label: "Needs you: disk", apply: () => { ready(); S.scenario = "disk"; startPipeline(); } },
	busy: { label: "Simulator busy", apply: () => { ready(); S.scenario = "busy"; startPipeline(); } },
	columns: { label: "Unclear columns", apply: () => { S.casesRead = true; S.mappingFixed = false; } },
	results: { label: "Results to review", apply: () => { ready(); S.sha = "a1b2c3d"; S.phase = "results"; S.stages = doneStages(); S.runResults = { ...RESULTS }; } },
	promptform: { label: "Describe a check", apply: () => { ready(); Object.assign(S, { testsMode: "prompt", promptKind: "bug", promptTicket: "IOS-47031", jira: { key: "IOS-47031", ...JIRA["IOS-47031"] }, promptText: "Make sure the app no longer freezes on the Tomorrow tab of Flash Sale, and the product list shows." }); } },
	promptresult: { label: "Check result → save macro", apply: () => { SCENARIOS.promptform.apply(); Object.assign(S, { runKind: "prompt", phase: "results", sha: "a1b2c3d", recorded: [...PROMPT_STEPS], promptResult: { verdict: "PASS", summary: "The Tomorrow tab opened in 0.8 s, the product list appeared with 12 products and the app stayed responsive. “Remind me” is shown on each product." } }); S.stages = doneStages(); S.stages[4].label = "Claude checks it"; S.stages[4].note = "6 steps recorded"; } },
	replay: { label: "Replay a macro", apply: () => { ready(); Object.assign(S, { runKind: "replay", replayMacro: S.macros[1] }); startPipeline(); } },
	heal: { label: "Replay needs repair", apply: () => { ready(); Object.assign(S, { scenario: "heal", runKind: "replay", replayMacro: S.macros[1] }); startPipeline(); } },
	localdrift: { label: "Local repository changed", apply: () => { SCENARIOS.results.apply(); Object.assign(S, { mode: "local", localId: "poc", localDrift: true, sha: "1107d7f+e41a" }); S.stages[0].label = "Snapshot your local repository"; S.stages[0].note = "darshan/innovation/test-forge @ 1107d7f+e41a"; } },
};
function applyScenario(key) {
	clearTimers(); S = fresh();
	document.querySelectorAll("#scenarioButtons button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.key === key)));
	if (key !== "home") TAB = "cases";
	SCENARIOS[key].apply(); render();
}

// Events ---------------------------------------------------------------------------------------
document.addEventListener("click", (e) => {
	const t = e.target.closest("[data-act]");
	if (!t) { if (S.comboOpen && !e.target.closest(".combo")) { S.comboOpen = false; render(); } return; }
	const act = t.dataset.act; const id = t.dataset.id;
	if (act === "close-overlay" && e.target.closest("[data-stop]") && !t.matches("button")) return;
	if (t.matches("select, input") && act !== "branch-input") return;
	switch (act) {
		case "tab": TAB = t.dataset.tab; break;
		case "goto-cases": TAB = "cases"; break;
		case "start-cases": TAB = "cases"; if (S.phase !== "pipeline") { S.phase = "form"; S.testsMode = "cases"; } break;
		case "start-prompt": TAB = "cases"; if (S.phase !== "pipeline") { S.phase = "form"; S.testsMode = "prompt"; } break;
		case "start-replay": document.getElementById("homeMacros")?.scrollIntoView({ behavior: "smooth" }); return;
		case "open-run": TAB = "cases"; applyScenario(t.dataset.scenario); return;
		case "show-map": S.mapMacro = id; S.dialog = "macro-map"; break;
		case "load-jira": {
			const key = S.promptTicket.trim().toUpperCase(); S.jiraLoading = true; S.jiraError = ""; S.jira = null; render();
			later(900, () => {
				S.jiraLoading = false; const t = JIRA[key];
				if (!t) S.jiraError = `<b>${esc(key)}</b> wasn't found, or you don't have access to it.`;
				else if (t.type !== "Bug") S.jiraError = `<b>${esc(key)}</b> is ${t.type === "Improvement" ? "an" : "a"} <b>${esc(t.type)}</b>, not a Bug. Bug-fix checks only accept Bug tickets — use <b>Check a flow</b> for anything else.`;
				else { S.jira = { key, ...t }; if (!S.promptText.trim()) S.promptText = `Make sure this no longer happens: ${t.title}.`; }
				render();
			});
			return;
		}
		case "adv-toggle": S.advOpen = !t.parentElement.open; return;
		case "branch-input": S.comboOpen = true; S.branchQuery = ""; render(); document.getElementById("branchInput")?.focus(); return;
		case "pick-branch": S.branch = t.dataset.branch; S.comboOpen = false; break;
		case "read": S.reading = true; render(); later(1400, () => { S.reading = false; S.casesRead = true; render(); toast("96 test cases read"); }); return;
		case "change-source": S.casesRead = false; break;
		case "sel-all": CASES.forEach((c) => S.selected.add(c.id)); break;
		case "sel-none": S.selected.clear(); break;
		case "sel-failed": S.selected = new Set(["SF-023", "SF-084"]); toast("Selected the 2 tests that failed last time"); break;
		case "start": S.runKind = S.testsMode === "prompt" ? "prompt" : "cases"; startPipeline(); return;
		case "replay": TAB = "cases"; S.dialog = null; clearTimers(); S.runKind = "replay"; S.replayMacro = S.macros.find((m) => m.id === id); S.healed = false; startPipeline(); return;
		case "heal": S.heal = "looking"; render(); later(1300, () => { S.heal = "proposal"; render(); }); return;
		case "approve-heal": { S.healed = true; S.heal = null; const st = stage("run"); st.state = "run"; st.note = ""; S.replayIndex += 1; toast("Fixed — 2 macros now use the new locator"); render(); runReplay(); return; }
		case "p-agree": S.promptReview = { kind: "accepted" }; break;
		case "p-change": S.showChange = true; break;
		case "p-change-confirm": { const reason = document.getElementById("pvReason").value.trim(); if (reason.length < 8) { document.getElementById("pvErr").hidden = false; return; } S.promptReview = { kind: "overridden", to: document.getElementById("pvTo").value, reason }; break; }
		case "save-macro": S.dialog = "save-macro"; break;
		case "confirm-macro": { const name = document.getElementById("macroName").value.trim() || "Untitled macro"; S.macros.push({ id: "mc_01J9ZQ" + Math.random().toString(36).slice(2, 6).toUpperCase(), name, kind: document.getElementById("macroKind").value, last: "✓ just now", steps: [...S.recorded] }); S.savedMacro = true; S.dialog = null; toast(`Saved “${name}” — find it under Macros on the right`); break; }
		case "retry": runStage(Number(t.dataset.i)); return;
		case "free-disk": S.diskFixed = true; toast("Freed 22 GB"); runStage(Number(t.dataset.i)); return;
		case "copy-log": toast("Build log copied"); break;
		case "cancel-all": clearTimers(); S.phase = "form"; S.stages = []; S.approval = null; S.heal = null; toast("Stopped"); break;
		case "edit": case "new-test": S.phase = "form"; S.stages = []; break;
		case "approve": case "approve-always": S.approval = null; S.approvedOnce = true; toast(act === "approve" ? "Allowed once" : "Always allowed in this project"); break;
		case "deny": S.approval = null; S.approvedOnce = true; toast("Not allowed — Claude continues without it"); break;
		case "pause": S.paused = true; break;
		case "skip-case": toast(`Skipped ${runCases()[S.runIndex]?.id ?? ""}`); S.tick = 99; break;
		case "open-session": toast("Opens this test's Claude conversation in Sessions"); break;
		case "show-sim": toast("Brings the Simulator app's QA window to the front"); break;
		case "open-case": S.drawer = id; break;
		case "quick-accept": S.human[id] = { kind: "accepted" }; break;
		case "accept": S.human[id] = { kind: "accepted" }; S.drawer = null; break;
		case "rerun-one": S.human[id] = { kind: "rerun" }; S.drawer = null; toast(`${id} will run again`); break;
		case "override": { const reason = document.getElementById("ovReason").value.trim(); if (reason.length < 8) { document.getElementById("ovErr").hidden = false; document.getElementById("ovReason").focus(); return; } S.human[id] = { kind: "overridden", to: document.getElementById("ovTo").value, reason }; S.drawer = null; break; }
		case "undo-signoff": delete S.human[id]; break;
		case "accept-all-pass": Object.keys(S.runResults).forEach((x) => { if (verdictOf(x) === "PASS" && !S.human[x]) S.human[x] = { kind: "accepted" }; }); break;
		case "rerun-failed": toast("Re-running the tests that didn't pass…"); later(1400, () => { S.flaky.add("SF-023"); delete S.human["SF-023"]; render(); toast("SF-023 passed on re-run → marked FLAKY · SF-084 still couldn't finish"); }); return;
		case "run-again": S.localDrift = false; startPipeline(); return;
		case "run-saved": { const x = SETUPS[Number(t.dataset.i)]; const env = { preparedSha: S.preparedSha, builtSha: S.builtSha, installedSha: S.installedSha, simState: S.simState, harness: S.harness, macros: S.macros }; TAB = "cases"; clearTimers(); S = fresh(); ready(); if (env.builtSha) Object.assign(S, env); Object.assign(S, { mode: x.mode, branch: x.branch, localId: x.localId, selected: new Set(x.selected) }); toast(`Loaded “${x.name}” — with the latest code`); startPipeline(); return; }
		case "report": S.dialog = "report"; break;
		case "export": toast("Downloaded test-forge-run-develop-a1b2c3d.md"); break;
		case "publish": toast("Published to your personal Confluence page"); S.dialog = null; break;
		case "save-setup": S.dialog = "save-setup"; break;
		case "confirm-save": { const name = document.getElementById("setupName").value.trim() || "My setup"; SETUPS.push({ name, note: "saved just now", mode: S.mode, branch: S.branch, localId: S.localId, selected: [...S.selected] }); toast(`Saved “${name}” — find it under Saved setups`); S.dialog = null; break; }
		case "close-overlay": S.drawer = null; S.dialog = null; break;
		case "noop": toast("Not part of this prototype"); break;
		default: return;
	}
	render();
});
function rerenderKeepingFocus(selector) {
	const el = document.querySelector(selector); const pos = el?.selectionStart;
	render();
	const again = document.querySelector(selector); if (again) { again.focus(); if (pos != null) again.setSelectionRange(pos, pos); }
}
document.addEventListener("input", (e) => {
	const act = e.target.dataset.act;
	if (act === "branch-input") { S.branchQuery = e.target.value; S.comboOpen = true; rerenderKeepingFocus("#branchInput"); }
	if (act === "filter") { S.filter = e.target.value; rerenderKeepingFocus('[data-act="filter"]'); }
	if (act === "source") S.source = e.target.value;
	if (act === "skip-reason") S.skipReason = e.target.value;
	if (act === "prompt-text") { S.promptText = e.target.value; rerenderKeepingFocus('[data-act="prompt-text"]'); }
	if (act === "prompt-ticket") { S.promptTicket = e.target.value; S.jira = null; S.jiraError = ""; rerenderKeepingFocus('[data-act="prompt-ticket"]'); }
});
document.addEventListener("change", (e) => {
	const act = e.target.dataset.act;
	if (act === "mode") { S.mode = e.target.value; render(); }
	if (act === "tests-mode") { S.testsMode = e.target.value; render(); }
	if (act === "prompt-kind") { S.promptKind = e.target.value; render(); }
	if (act === "start-from") S.startFrom = e.target.value;
	if (act === "macro-reviewed") document.getElementById("confirmMacro").disabled = !e.target.checked;
	if (act === "local") { if (e.target.value === "__other") { toast("Would ask for a path — it must be a git working copy (contain a .git folder)"); e.target.value = S.localId; return; } S.localId = e.target.value; render(); }
	if (act === "repo") { if (e.target.value === "__add") { toast("Would ask for a GitHub link"); e.target.value = S.repo; return; } S.repo = e.target.value; render(); }
	if (act === "sel") { e.target.checked ? S.selected.add(e.target.dataset.id) : S.selected.delete(e.target.dataset.id); render(); }
	if (act === "map") { S.mappingFixed = true; render(); toast("Got it — remembered for this page"); }
	if (act === "mocks") S.mocks = e.target.value;
	if (act === "policy") S.policy = e.target.value;
	if (act === "skip-build") { S.skipBuild = e.target.checked; S.advOpen = true; render(); }
});
document.addEventListener("keydown", (e) => {
	if (e.key === "Escape" && (S.drawer || S.dialog || S.comboOpen)) { S.drawer = null; S.dialog = null; S.comboOpen = false; render(); }
	if (e.key === "Enter" && e.target.id === "branchInput") { const first = BRANCHES.find((b) => b.name.toLowerCase().includes(S.branchQuery.toLowerCase())); if (first) { S.branch = first.name; S.comboOpen = false; render(); } }
});

document.getElementById("scenarioButtons").innerHTML = Object.entries(SCENARIOS).map(([k, v]) => `<button data-key="${k}" aria-pressed="${k === "home"}">${v.label}</button>`).join("");
document.getElementById("scenarioButtons").addEventListener("click", (e) => { const b = e.target.closest("button[data-key]"); if (b) { e.stopPropagation(); applyScenario(b.dataset.key); } });
applyScenario("home");
